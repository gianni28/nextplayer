[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    # Siempre se revalida (con ETag es barato): así los datos nuevos se ven al instante.
    Cache-Control = "public, max-age=0, must-revalidate"

